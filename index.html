<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Building Occupancy Prediction</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#0d47a1;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:420px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#0d47a1;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

#result{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}
</style>

</head>
<body>

<header>
<h1>Smart Building Occupancy Prediction</h1>
<p>Machine Learning Mini Project</p>
</header>

<div class="container">

<h2>Enter Sensor Values</h2>

<input type="number" id="temp" placeholder="Temperature">

<input type="number" id="hum" placeholder="Humidity">

<input type="number" id="light" placeholder="Light">

<input type="number" id="co2" placeholder="CO₂">

<input type="number" id="ratio" placeholder="Humidity Ratio">

<button onclick="predict()">Predict</button>

<div id="result"></div>

</div>

<script>

function predict(){

let temp=parseFloat(document.getElementById("temp").value);
let hum=parseFloat(document.getElementById("hum").value);
let light=parseFloat(document.getElementById("light").value);
let co2=parseFloat(document.getElementById("co2").value);
let ratio=parseFloat(document.getElementById("ratio").value);

if(isNaN(temp)||isNaN(hum)||isNaN(light)||isNaN(co2)||isNaN(ratio)){
document.getElementById("result").innerHTML="Please enter all values.";
document.getElementById("result").style.color="red";
return;
}

if(light>300 || co2>600){
document.getElementById("result").innerHTML="✅ Prediction: ROOM OCCUPIED";
document.getElementById("result").style.color="green";
}
else{
document.getElementById("result").innerHTML="❌ Prediction: ROOM UNOCCUPIED";
document.getElementById("result").style.color="red";
}

}

</script>

</body>
</html>
